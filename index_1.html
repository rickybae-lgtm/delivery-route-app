<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 배송 루트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F5F2EA; --surface:#FFFFFF; --surface-2:#ECE6D6; --ink:#1B211D; --ink-soft:#63695F;
    --accent:#E2591C; --accent-ink:#FFFFFF; --cold:#1C6E8C; --frozen:#4B3F91; --porch:#8A6D3B; --line:#DCD3BE;
    --danger:#B23A2E; --warn:#B2790E; --shadow: 0 1px 2px rgba(27,33,29,.06), 0 4px 14px rgba(27,33,29,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181A; --surface:#1C2224; --surface-2:#232B2D; --ink:#EDEFE9; --ink-soft:#9AA39C;
      --accent:#FF7A3D; --accent-ink:#1B211D; --cold:#55B7D6; --frozen:#9186E0; --porch:#D3AA6E; --line:#2E3638;
      --danger:#F0796B; --warn:#E8B84B; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181A; --surface:#1C2224; --surface-2:#232B2D; --ink:#EDEFE9; --ink-soft:#9AA39C;
    --accent:#FF7A3D; --accent-ink:#1B211D; --cold:#55B7D6; --frozen:#9186E0; --porch:#D3AA6E; --line:#2E3638;
    --danger:#F0796B; --warn:#E8B84B; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
    padding:0 16px; padding-block:20px 56px;
  }
  .wrap{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  h1,h2,h3{ font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif; font-weight:400; text-wrap:balance; margin:0; letter-spacing:.01em; }
  .app-header{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .app-header h1{ font-size:30px; color:var(--ink); }
  .app-header .date{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .lede{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin-top:-8px; }

  section.card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
  }
  section.card > h2{ font-size:22px; display:flex; align-items:center; gap:8px; }
  .step-no{
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; color:var(--accent-ink);
    background:var(--accent); width:22px; height:22px; border-radius:6px; display:inline-flex;
    align-items:center; justify-content:center; flex:none;
  }
  .hint{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; }

  label.field{ display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--ink-soft); }
  label.field span.lbl{ font-weight:600; color:var(--ink); font-size:13px; }
  input, select, textarea{
    font:inherit; font-size:14.5px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ resize:vertical; min-height:52px; font-family:inherit; }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:460px){ .row2{ grid-template-columns:1fr; } }

  button{ font:inherit; cursor:pointer; border-radius:9px; border:1px solid transparent; padding:10px 14px; font-weight:600; font-size:14px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:transparent; color:var(--danger); border-color:var(--line); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .stop-picker{ display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; padding-right:2px; }
  .pick-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-size:14px; }
  .pick-row.is-start{ border-color:var(--accent); }
  .pick-row input[type="checkbox"], .pick-row input[type="radio"]{ width:17px; height:17px; flex:none; accent-color:var(--accent); }
  .pick-row .name{ font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{ font-size:11px; font-weight:600; padding:2px 7px; border-radius:20px; flex:none; letter-spacing:.02em; }
  .badge.cold{ background:color-mix(in srgb, var(--cold) 18%, transparent); color:var(--cold); }
  .badge.frozen{ background:color-mix(in srgb, var(--frozen) 18%, transparent); color:var(--frozen); }
  .badge.ambient{ background:color-mix(in srgb, var(--ink-soft) 16%, transparent); color:var(--ink-soft); }
  .badge.porch{ background:color-mix(in srgb, var(--porch) 20%, transparent); color:var(--porch); }
  .badge.mix{ background:linear-gradient(90deg, color-mix(in srgb, var(--cold) 28%, transparent), color-mix(in srgb, var(--frozen) 28%, transparent)); color:var(--frozen); }
  .badge.start{ background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent); }
  .badge.warn{ background:color-mix(in srgb, var(--warn) 20%, transparent); color:var(--warn); }
  .move-btns{ display:flex; flex-direction:column; gap:3px; flex:none; }
  .move-btns button{ width:26px; height:24px; padding:0; font-size:12px; line-height:1; border-radius:6px; }

  .empty{ font-size:13.5px; color:var(--ink-soft); padding:10px 2px; }

  .route-list{ display:flex; flex-direction:column; gap:10px; }
  .stop-card{ display:flex; gap:12px; padding:12px; border:1px solid var(--line); border-radius:11px; background:var(--surface-2); }
  .stop-card.done{ opacity:.45; }
  .stop-card.done .stop-name{ text-decoration:line-through; }
  .stop-card.next{ border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .done-check{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); flex:none; }
  .done-check input{ width:18px; height:18px; accent-color:var(--accent); }
  .order-num{ font-family:"Black Han Sans",sans-serif; font-size:24px; color:var(--accent); flex:none; width:30px; text-align:center; line-height:1.3; }
  .stop-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .stop-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .stop-name{ font-weight:700; font-size:15.5px; }
  .stop-addr{ font-size:13px; color:var(--ink-soft); }
  .stop-notes{ font-size:12.5px; color:var(--ink-soft); display:flex; flex-direction:column; gap:2px; }
  .stop-notes b{ color:var(--ink); font-weight:600; }
  .leg-dist{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .stop-actions{ display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
  a.tmap-link, .stop-actions a{ text-decoration:none; display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); padding:5px 10px; border-radius:7px; }

  .leg-groups{ display:flex; flex-direction:column; gap:8px; }
  .leg-group{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; font-size:13.5px; }

  .searchbar{ display:flex; gap:8px; }
  .searchbar input{ flex:1; }
  .loc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  .loc-card{ border:1px solid var(--line); background:var(--surface-2); border-radius:11px; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .loc-card .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .loc-card .name{ font-weight:700; font-size:15px; }
  .loc-card .addr{ font-size:12.5px; color:var(--ink-soft); }
  .kv{ font-size:12.5px; display:flex; gap:6px; }
  .kv b{ color:var(--ink-soft); font-weight:600; min-width:44px; flex:none; }
  .kv code{ font-family:"IBM Plex Mono",monospace; background:var(--surface); border:1px solid var(--line); padding:1px 6px; border-radius:5px; }
  .memo{ font-size:12.5px; color:var(--ink); background:var(--surface); border-radius:7px; padding:6px 8px; border:1px solid var(--line); }
  .card-actions{ display:flex; gap:6px; margin-top:2px; flex-wrap:wrap; }

  .banner{ font-size:12.5px; padding:9px 12px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); }
  .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:90vw; text-align:center; }
  .toast.show{ opacity:1; }
  .spinner{ display:inline-block; width:13px; height:13px; border:2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .divider{ height:1px; background:var(--line); border:0; margin:2px 0; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="app-header">
    <h1>오늘의 배송 루트</h1>
    <span class="date" id="todayDate"></span>
  </header>
  <p class="lede">이름과 주소만 입력하면 자동으로 좌표를 찾고, 실제 도로 주행거리 기준으로 오늘의 방문 순서를 계산합니다. 데이터는 이 기기(브라우저)에만 저장됩니다.</p>

  <section class="card" id="pickerCard">
    <h2><span class="step-no">1</span>출발지 &amp; 오늘 배달처 고르기</h2>
    <div class="hint" id="pickerHint"></div>
    <div class="stop-picker" id="stopPicker"></div>
    <label class="field" style="max-width:180px;"><span class="lbl">오늘 출발 시각</span><input type="time" id="departTime" value="03:00"></label>
    <div class="btn-row">
      <button class="btn-primary" id="calcBtn">오늘 순서 계산하기 (실제 도로거리)</button>
      <button class="btn-ghost btn-sm" id="clearPickBtn" type="button">선택 초기화</button>
    </div>
  </section>

  <section class="card" id="routeCard" style="display:none;">
    <h2><span class="step-no">2</span>오늘의 방문 순서</h2>
    <div class="hint" id="routeSummary"></div>
    <div class="btn-row">
      <button class="btn-primary" id="nextStopBtn" type="button">▶ 다음 배달처 티맵으로 열기</button>
      <button class="btn-ghost btn-sm" id="resetDoneBtn" type="button">완료 표시 초기화</button>
    </div>
    <div class="route-list" id="routeList"></div>
    <hr class="divider">
    <div class="hint">티맵 앱은 경유지를 최대 5곳까지 받을 수 있어, 구간을 나눠 열어드립니다.</div>
    <div class="leg-groups" id="legGroups"></div>
    <div class="btn-row">
      <button class="btn-ghost btn-sm" id="copyRouteBtn" type="button">순서 텍스트로 복사</button>
    </div>
  </section>

  <section class="card">
    <h2><span class="step-no">3</span>배달처 등록 / 수정</h2>
    <div class="hint">이름과 주소만 입력하고 저장하면 자동으로 좌표를 찾아 저장합니다. 자동으로 못 찾으면 알려드리니 그때만 수동으로 넣으시면 됩니다.</div>
    <form id="locForm">
      <input type="hidden" id="editId">
      <div class="row2">
        <label class="field"><span class="lbl">배달처 이름 *</span><input type="text" id="f_name" placeholder="예: 상록회관, 미소식당" required></label>
        <label class="field"><span class="lbl">보관 구분</span>
          <select id="f_category">
            <option value="kitchen">주방상온</option>
            <option value="porch">현관상온</option>
            <option value="cold">냉장주의</option>
            <option value="frozen">냉동주의</option>
            <option value="mix">냉장 및 냉동주의</option>
          </select>
        </label>
      </div>
      <label class="field" style="margin-top:10px;"><span class="lbl">주소 *</span><input type="text" id="f_address" placeholder="지번 또는 도로명 주소" required></label>
      <details style="margin-top:8px;">
        <summary style="cursor:pointer; font-size:12.5px; color:var(--ink-soft);">좌표 직접 입력 / 확인 (평소엔 안 열어보셔도 됩니다)</summary>
        <div class="row2" style="margin-top:8px;">
          <label class="field"><span class="lbl">위도 (lat)</span><input type="text" inputmode="decimal" id="f_lat" placeholder="자동으로 채워집니다"></label>
          <label class="field"><span class="lbl">경도 (lng)</span><input type="text" inputmode="decimal" id="f_lng" placeholder="자동으로 채워집니다"></label>
        </div>
        <div class="btn-row" style="margin-top:8px;">
          <button type="button" class="btn-ghost btn-sm" id="regeoBtn">📍 이 주소로 좌표 다시 찾기</button>
        </div>
      </details>
      <div class="row2" style="margin-top:10px;">
        <label class="field"><span class="lbl">열쇠 위치</span><input type="text" id="f_key" placeholder="예: 후문 화분 밑, 경비실 맡김"></label>
        <label class="field"><span class="lbl">출입 비밀번호</span><input type="text" id="f_pw" placeholder="예: 1234#"></label>
      </div>
      <div class="row2" style="margin-top:10px;">
        <label class="field"><span class="lbl">오픈(개점) 시각 — 선택</span><input type="time" id="f_open"></label>
      </div>
      <label class="field" style="margin-top:10px;"><span class="lbl">기타 메모</span><textarea id="f_memo" placeholder="예: 오전 9시 이전 배송 금지, 계단 3층, 개 조심"></textarea></label>
      <label class="field" style="margin-top:10px; flex-direction:row; align-items:center; gap:8px;">
        <input type="checkbox" id="f_isStart" style="width:17px;height:17px;accent-color:var(--accent);">
        <span class="lbl" style="margin:0;">이 장소를 출발지 후보로 사용 (예: 창고, 물류센터)</span>
      </label>
      <div class="btn-row" style="margin-top:14px;">
        <button type="submit" class="btn-primary" id="saveLocBtn">배달처 저장</button>
        <button type="button" class="btn-ghost" id="cancelEditBtn" style="display:none;">수정 취소</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2><span class="step-no">4</span>배달처 목록 <span style="font-size:13px; font-weight:600; color:var(--ink-soft);" id="locCount"></span></h2>
    <div class="searchbar"><input type="text" id="searchInput" placeholder="이름, 주소, 메모로 검색"></div>
    <div class="loc-grid" id="locGrid"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'deliveryRoute.locations.v1';

  var todayEl = document.getElementById('todayDate');
  todayEl.textContent = new Intl.DateTimeFormat('ko-KR', { month:'long', day:'numeric', weekday:'short' }).format(new Date());

  var CAT_LABEL = { kitchen:'주방상온', porch:'현관상온', cold:'냉장주의', frozen:'냉동주의', mix:'냉장·냉동주의' };
  var CAT_CLASS = { kitchen:'ambient', porch:'porch', cold:'cold', frozen:'frozen', mix:'mix' };
  var DWELL_MIN = 5;

  var state = { locations: [], selected:{}, startId:null, order:null };

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function loadLocations(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveLocations(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.locations)); }
    catch (e) { toast('저장 공간이 가득 찼거나 저장에 실패했어요.'); }
  }

  function hasCoords(loc){ return typeof loc.lat === 'number' && typeof loc.lng === 'number' && !isNaN(loc.lat) && !isNaN(loc.lng); }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function locById(id){ return state.locations.find(function(l){ return l.id === id; }); }
  function fmtKm(m){ var km = m/1000; return km < 1 ? Math.round(m) + 'm' : km.toFixed(1) + 'km'; }
  function fmtMin(s){ return Math.round(s/60) + '분'; }
  function parseHHMM(s){ if (!s) return null; var m = /^(\d{1,2}):(\d{2})/.exec(s); return m ? parseInt(m[1],10)*60+parseInt(m[2],10) : null; }
  function fmtHHMM(mins){ mins = ((mins % 1440) + 1440) % 1440; var h = Math.floor(mins/60), m = Math.round(mins%60); return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }

  function tmapSearchLink(q){ return 'tmap://search?name=' + encodeURIComponent(q); }
  function googleMapsSearchLink(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
  function singleTmapLink(from, dest){
    return 'tmap://route?startname=' + encodeURIComponent(from ? (from.name||'출발지') : '현재위치') +
      (from ? '&startx=' + from.lng + '&starty=' + from.lat : '') +
      '&goalname=' + encodeURIComponent(dest.name) + '&goalx=' + dest.lng + '&goaly=' + dest.lat;
  }
  function tmapMultiLink(legStops){
    var from = legStops[0], dests = legStops.slice(1);
    if (!dests.length) return null;
    var goal = dests[dests.length-1], vias = dests.slice(0, dests.length-1);
    var params = [
      'startname=' + encodeURIComponent(from.name || '출발지'), 'startx=' + from.lng, 'starty=' + from.lat,
      'goalname=' + encodeURIComponent(goal.name), 'goalx=' + goal.lng, 'goaly=' + goal.lat
    ];
    vias.forEach(function(v, idx){
      var n = idx+1;
      params.push('via'+n+'name=' + encodeURIComponent(v.name));
      params.push('via'+n+'x=' + v.lng);
      params.push('via'+n+'y=' + v.lat);
    });
    return 'tmap://route?' + params.join('&');
  }

  // ---------- geocoding ----------
  function geocode(query){
    return fetch('/api/geocode?q=' + encodeURIComponent(query)).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); });
  }

  // ---------- routing (real road distance) ----------
  function fetchRealRoute(start, stops){
    return fetch('/api/route', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: { lat:start.lat, lng:start.lng }, stops: stops.map(function(s){ return { lat:s.lat, lng:s.lng, _ref:s.id }; }) })
    }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); });
  }

  // ---------- rendering ----------
  function renderPicker(){
    var wrap = document.getElementById('stopPicker');
    var hint = document.getElementById('pickerHint');
    hint.textContent = state.locations.length ? '' : '등록된 배달처가 없습니다. 아래 3번 "배달처 등록"에서 먼저 추가해 주세요.';
    wrap.innerHTML = '';
    if (!state.locations.length){ wrap.innerHTML = '<div class="empty">등록된 배달처가 없습니다.</div>'; return; }
    state.locations.forEach(function(loc){
      var row = document.createElement('label');
      row.className = 'pick-row' + (state.startId === loc.id ? ' is-start' : '');
      row.innerHTML =
        '<input type="radio" name="startPick" data-id="' + loc.id + '" ' + (state.startId===loc.id?'checked':'') + '>' +
        '<input type="checkbox" data-sel-id="' + loc.id + '" ' + (state.selected[loc.id]?'checked':'') + '>' +
        '<span class="name">' + escapeHtml(loc.name) + '</span>' +
        '<span class="badge ' + CAT_CLASS[loc.category] + '">' + CAT_LABEL[loc.category] + '</span>' +
        (loc.isStart ? '<span class="badge start">출발지 후보</span>' : '') +
        (!hasCoords(loc) ? '<span class="badge warn">좌표없음</span>' : '');
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('input[name="startPick"]').forEach(function(r){ r.addEventListener('change', function(){ state.startId = this.dataset.id; renderPicker(); }); });
    wrap.querySelectorAll('input[data-sel-id]').forEach(function(c){ c.addEventListener('change', function(){ if (this.checked) state.selected[this.dataset.selId]=true; else delete state.selected[this.dataset.selId]; }); });
  }

  function moveStop(idx, delta){
    var seq = state.order.seq, j = idx+delta;
    if (j<0 || j>=seq.length) return;
    var tmp = seq[idx]; seq[idx]=seq[j]; seq[j]=tmp;
    renderRoute();
  }
  function moveStopToEnd(idx){
    var seq = state.order.seq;
    seq.push(seq.splice(idx,1)[0]);
    renderRoute();
  }

  function estimateSchedule(departMin, seq, legs){
    var cur = departMin, out = [];
    seq.forEach(function(loc, i){
      var leg = legs && legs[i];
      var arrivalMin = null;
      if (leg){
        cur += leg.durationS/60;
        arrivalMin = cur;
        cur += DWELL_MIN;
      }
      var openMin = parseHHMM(loc.openTime);
      var early = (arrivalMin!=null) && (openMin!=null) && (arrivalMin < openMin-0.5);
      out.push({ loc:loc, arrivalMin:arrivalMin, early:early, leg:leg });
    });
    return out;
  }

  function renderRoute(){
    var card = document.getElementById('routeCard');
    if (!state.order){ card.style.display='none'; return; }
    card.style.display='flex';
    var start = state.order.start, seq = state.order.seq, legs = state.order.legs;
    var departMin = parseHHMM(document.getElementById('departTime').value) || 180;
    var schedule = estimateSchedule(departMin, seq, legs);
    var list = document.getElementById('routeList'); list.innerHTML='';
    var lateCount = 0, totalDist = state.order.totalDistanceM || 0, totalDur = state.order.totalDurationS || 0;
    var prev = start;

    if (!state.order.completed) state.order.completed = {};
    var completed = state.order.completed;
    var nextIdx = schedule.findIndex(function(entry){ return !completed[entry.loc.id]; });

    schedule.forEach(function(entry, i){
      var loc = entry.loc;
      if (entry.early) lateCount++;
      var isDone = !!completed[loc.id];
      var isNext = (i === nextIdx);
      var distLine = entry.leg
        ? ('이전 지점에서 실제 주행 ' + fmtKm(entry.leg.distanceM) + ' (' + fmtMin(entry.leg.durationS) + ') · 예상 도착 ' + fmtHHMM(entry.arrivalMin))
        : '경로 정보 없음';
      var actionLink = hasCoords(loc)
        ? '<a href="' + singleTmapLink(prev, loc) + '">이 배달처만 티맵 길찾기 →</a>'
        : '<a href="' + tmapSearchLink(loc.address||loc.name) + '">티맵에서 주소 검색하기 →</a>';
      var notesHtml = '';
      if (loc.keyLoc) notesHtml += '<div><b>열쇠</b> ' + escapeHtml(loc.keyLoc) + '</div>';
      if (loc.pw) notesHtml += '<div><b>비밀번호</b> ' + escapeHtml(loc.pw) + '</div>';
      if (loc.memo) notesHtml += '<div><b>메모</b> ' + escapeHtml(loc.memo) + '</div>';

      var card2 = document.createElement('div');
      card2.className = 'stop-card' + (isDone ? ' done' : '') + (isNext ? ' next' : '');
      card2.innerHTML =
        '<div class="order-num">' + (i+1) + '</div>' +
        '<div class="move-btns">' +
          '<button class="btn-ghost" data-up="'+i+'" ' + (i===0?'disabled':'') + '>▲</button>' +
          '<button class="btn-ghost" data-down="'+i+'" ' + (i===schedule.length-1?'disabled':'') + '>▼</button>' +
        '</div>' +
        '<div class="stop-body">' +
          '<div class="stop-top"><span class="stop-name">' + escapeHtml(loc.name) + '</span>' +
          '<span class="badge ' + CAT_CLASS[loc.category] + '">' + CAT_LABEL[loc.category] + '</span>' +
          (isNext ? '<span class="badge start">▶ 다음 목적지</span>' : '') +
          (entry.early ? '<span class="badge warn">⏰ 개점 전 도착 예상 (예상 ' + fmtHHMM(entry.arrivalMin) + ' / 오픈 ' + loc.openTime + ')</span>' : '') +
          '<label class="done-check" style="margin-left:auto;"><input type="checkbox" data-done="'+i+'" ' + (isDone?'checked':'') + '> 도착 완료</label>' +
          '</div>' +
          (loc.address ? '<div class="stop-addr">' + escapeHtml(loc.address) + '</div>' : '') +
          '<div class="leg-dist">' + distLine + '</div>' +
          (notesHtml ? '<div class="stop-notes">' + notesHtml + '</div>' : '') +
          '<div class="stop-actions">' + actionLink + '<button class="btn-ghost btn-sm" data-toend="'+i+'" type="button">맨 뒤로 보내기</button></div>' +
        '</div>';
      list.appendChild(card2);
      prev = loc;
    });

    list.querySelectorAll('[data-up]').forEach(function(b){ b.addEventListener('click', function(){ moveStop(parseInt(this.dataset.up,10), -1); }); });
    list.querySelectorAll('[data-down]').forEach(function(b){ b.addEventListener('click', function(){ moveStop(parseInt(this.dataset.down,10), 1); }); });
    list.querySelectorAll('[data-toend]').forEach(function(b){ b.addEventListener('click', function(){ moveStopToEnd(parseInt(this.dataset.toend,10)); }); });
    list.querySelectorAll('[data-done]').forEach(function(b){
      b.addEventListener('change', function(){
        var idx = parseInt(this.dataset.done,10);
        var loc = schedule[idx].loc;
        if (this.checked) completed[loc.id] = true; else delete completed[loc.id];
        renderRoute();
      });
    });

    var remaining = schedule.length - Object.keys(completed).filter(function(id){ return schedule.some(function(e){ return e.loc.id===id; }); }).length;
    document.getElementById('routeSummary').textContent =
      '출발 ' + fmtHHMM(departMin) + ' (' + start.name + ') · 총 ' + seq.length + '곳 (남은 ' + remaining + '곳) · 실제 도로거리 약 ' + fmtKm(totalDist) + ' · 예상 주행시간 ' + fmtMin(totalDur) +
      (lateCount ? ' · ⏰ 개점 전 도착 예상 ' + lateCount + '곳' : '');

    // 티맵 경유지는 최대 5곳까지 → 6곳(경유 5 + 목적지 1) 단위로 링크를 나눔
    var groupsEl = document.getElementById('legGroups'); groupsEl.innerHTML = '';
    var withCoordSeq = seq.filter(hasCoords);
    var chunkSize = 6, cursor = start;
    for (var gi=0; gi<withCoordSeq.length; gi+=chunkSize){
      var chunk = withCoordSeq.slice(gi, gi+chunkSize);
      var legStops = [cursor].concat(chunk);
      var link = tmapMultiLink(legStops);
      if (!link) continue;
      var g = document.createElement('div');
      g.className = 'leg-group';
      var fromLabel = cursor===start ? start.name : cursor.name;
      g.innerHTML = '<span>' + (gi+1) + '번 ~ ' + (gi+chunk.length) + '번 (' + escapeHtml(fromLabel) + ' 출발)</span>' +
        '<a class="tmap-link" href="' + link + '">티맵으로 열기 →</a>';
      groupsEl.appendChild(g);
      cursor = chunk[chunk.length-1];
    }
  }

  function renderLocGrid(){
    var q = (document.getElementById('searchInput').value||'').trim().toLowerCase();
    var grid = document.getElementById('locGrid'); grid.innerHTML='';
    var list = state.locations.filter(function(l){ return !q || (l.name+' '+(l.address||'')+' '+(l.memo||'')).toLowerCase().indexOf(q)!==-1; });
    document.getElementById('locCount').textContent = '(' + state.locations.length + '곳)';
    if (!list.length){ grid.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>'; return; }
    list.forEach(function(loc){
      var el = document.createElement('div');
      el.className = 'loc-card';
      el.innerHTML =
        '<div class="top"><span class="name">' + escapeHtml(loc.name) + '</span></div>' +
        '<div class="addr">' + (loc.address ? escapeHtml(loc.address) : '주소 미등록') + '</div>' +
        '<div><span class="badge ' + CAT_CLASS[loc.category] + '">' + CAT_LABEL[loc.category] + '</span> ' +
          (loc.isStart ? '<span class="badge start">출발지 후보</span>' : '') +
          (!hasCoords(loc) ? '<span class="badge warn">좌표없음</span>' : '') + '</div>' +
        (loc.keyLoc ? '<div class="kv"><b>열쇠</b><span>' + escapeHtml(loc.keyLoc) + '</span></div>' : '') +
        (loc.pw ? '<div class="kv"><b>비번</b><code>' + escapeHtml(loc.pw) + '</code></div>' : '') +
        (loc.openTime ? '<div class="kv"><b>오픈</b><span>' + escapeHtml(loc.openTime) + '</span></div>' : '') +
        (loc.memo ? '<div class="memo">' + escapeHtml(loc.memo) + '</div>' : '') +
        (!hasCoords(loc) ? '<div style="display:flex;gap:10px;flex-wrap:wrap;"><a href="' + tmapSearchLink(loc.address||loc.name) + '">티맵에서 주소 검색 →</a>' +
          '<a href="' + googleMapsSearchLink(loc.address||loc.name) + '" target="_blank">구글맵에서 좌표 찾기 →</a></div>' : '') +
        '<div class="card-actions"><button class="btn-ghost btn-sm" data-edit="' + loc.id + '">수정</button><button class="btn-danger btn-sm" data-del="' + loc.id + '">삭제</button></div>';
      grid.appendChild(el);
    });
    grid.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click', function(){ startEdit(this.dataset.edit); }); });
    grid.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(){ deleteLoc(this.dataset.del); }); });
  }

  function renderAll(){ renderPicker(); renderLocGrid(); }

  // ---------- form ----------
  function startEdit(id){
    var loc = locById(id); if (!loc) return;
    document.getElementById('editId').value = loc.id;
    document.getElementById('f_name').value = loc.name || '';
    document.getElementById('f_category').value = loc.category || 'kitchen';
    document.getElementById('f_address').value = loc.address || '';
    document.getElementById('f_lat').value = hasCoords(loc) ? loc.lat : '';
    document.getElementById('f_lng').value = hasCoords(loc) ? loc.lng : '';
    document.getElementById('f_key').value = loc.keyLoc || '';
    document.getElementById('f_pw').value = loc.pw || '';
    document.getElementById('f_open').value = loc.openTime || '';
    document.getElementById('f_memo').value = loc.memo || '';
    document.getElementById('f_isStart').checked = !!loc.isStart;
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('saveLocBtn').textContent = '수정 저장';
    document.getElementById('locForm').scrollIntoView({ behavior:'smooth', block:'start' });
  }
  function resetForm(){
    document.getElementById('locForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('saveLocBtn').textContent = '배달처 저장';
  }
  function deleteLoc(id){
    state.locations = state.locations.filter(function(l){ return l.id!==id; });
    delete state.selected[id];
    if (state.startId===id) state.startId=null;
    saveLocations(); renderAll(); toast('삭제했습니다.');
  }

  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  document.getElementById('regeoBtn').addEventListener('click', function(){
    var q = document.getElementById('f_address').value.trim() || document.getElementById('f_name').value.trim();
    if (!q){ toast('먼저 주소나 이름을 입력해주세요.'); return; }
    var btn = this; var orig = btn.textContent;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 찾는 중...';
    geocode(q).then(function(res){
      if (res.ok && res.data && typeof res.data.lat==='number'){
        document.getElementById('f_lat').value = res.data.lat;
        document.getElementById('f_lng').value = res.data.lng;
        toast('좌표를 찾았어요: ' + (res.data.matched||''));
      } else {
        toast('좌표를 찾지 못했어요. 주소를 조금 더 정확히 입력해보세요.');
      }
    }).catch(function(){ toast('좌표 검색 중 오류가 발생했어요.'); })
      .then(function(){ btn.disabled=false; btn.textContent=orig; });
  });

  document.getElementById('locForm').addEventListener('submit', function(e){
    e.preventDefault();
    var id = document.getElementById('editId').value;
    var lat = parseFloat(document.getElementById('f_lat').value);
    var lng = parseFloat(document.getElementById('f_lng').value);
    var name = document.getElementById('f_name').value.trim();
    var address = document.getElementById('f_address').value.trim();
    if (!name){ toast('배달처 이름을 입력해주세요.'); return; }
    if (!address){ toast('주소를 입력해주세요.'); return; }

    var data = {
      name: name, category: document.getElementById('f_category').value, address: address,
      lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng,
      keyLoc: document.getElementById('f_key').value.trim(), pw: document.getElementById('f_pw').value.trim(),
      openTime: document.getElementById('f_open').value || '', memo: document.getElementById('f_memo').value.trim(),
      isStart: document.getElementById('f_isStart').checked, updatedAt: Date.now()
    };

    var saveBtn = document.getElementById('saveLocBtn');
    var orig = saveBtn.textContent;

    function finishSave(finalData){
      if (id){
        var idx = state.locations.findIndex(function(l){ return l.id===id; });
        if (idx!==-1) state.locations[idx] = Object.assign({}, state.locations[idx], finalData);
      } else {
        finalData.id = 'loc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        state.locations.push(finalData);
      }
      saveLocations(); resetForm(); renderAll();
    }

    if (data.lat==null || data.lng==null){
      saveBtn.disabled = true; saveBtn.innerHTML = '<span class="spinner"></span> 좌표 찾는 중...';
      geocode(address).then(function(res){
        if (res.ok && res.data && typeof res.data.lat==='number'){
          data.lat = res.data.lat; data.lng = res.data.lng;
          toast('저장했어요 (좌표 자동 인식: ' + (res.data.matched||'') + ')');
        } else {
          toast('저장은 했지만 좌표를 자동으로 못 찾았어요. 나중에 "좌표 직접 입력"에서 다시 찾기를 눌러보세요.');
        }
        finishSave(data);
      }).catch(function(){
        toast('저장은 했지만 좌표 검색 중 오류가 있었어요.');
        finishSave(data);
      }).then(function(){ saveBtn.disabled=false; saveBtn.textContent=orig; });
    } else {
      finishSave(data);
      toast('저장했습니다.');
    }
  });

  document.getElementById('searchInput').addEventListener('input', renderLocGrid);
  document.getElementById('clearPickBtn').addEventListener('click', function(){ state.selected={}; renderPicker(); });
  document.getElementById('departTime').addEventListener('change', function(){ if (state.order) renderRoute(); });

  document.getElementById('calcBtn').addEventListener('click', function(){
    var startLoc = state.startId ? locById(state.startId) : null;
    var stops = Object.keys(state.selected).map(locById).filter(Boolean);
    if (!startLoc){ toast('출발지를 선택해주세요 (라디오 버튼).'); return; }
    if (!hasCoords(startLoc)){ toast('출발지에 좌표가 없어 순서를 계산할 수 없어요.'); return; }
    stops = stops.filter(function(s){ return s.id!==startLoc.id; });
    var withCoords = stops.filter(hasCoords);
    var withoutCoords = stops.filter(function(s){ return !hasCoords(s); });
    if (!withCoords.length){ toast('좌표가 있는 배달처를 1곳 이상 선택해주세요.'); return; }

    var btn = this; var orig = btn.textContent;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 실제 도로거리로 계산 중...';

    fetchRealRoute(startLoc, withCoords).then(function(res){
      if (!res.ok || !res.data || !res.data.order){
        toast('경로 계산에 실패했어요 (' + (res.data && res.data.error || '') + '). 잠시 후 다시 시도해주세요.');
        return;
      }
      var seq = res.data.order.map(function(s){ return locById(s._ref) || s; }).concat(withoutCoords);
      state.order = { start: startLoc, seq: seq, legs: res.data.legs, totalDistanceM: res.data.totalDistanceM, totalDurationS: res.data.totalDurationS };
      renderRoute();
      document.getElementById('routeCard').scrollIntoView({ behavior:'smooth', block:'start' });
      if (withoutCoords.length) toast('좌표 없는 ' + withoutCoords.length + '곳은 목록 맨 뒤에 순서 미정으로 추가했어요.');
    }).catch(function(){
      toast('경로 계산 중 오류가 발생했어요. 네트워크 상태를 확인해주세요.');
    }).then(function(){ btn.disabled=false; btn.textContent=orig; });
  });

  function goToNextStop(){
    if (!state.order) return;
    var start = state.order.start, seq = state.order.seq;
    var completed = state.order.completed || {};
    var idx = seq.findIndex(function(loc){ return !completed[loc.id]; });
    if (idx === -1){ toast('오늘 배송을 모두 완료하셨습니다! 🎉'); return; }
    var prev = idx===0 ? start : seq[idx-1];
    var loc = seq[idx];
    var link = hasCoords(loc) ? singleTmapLink(prev, loc) : tmapSearchLink(loc.address||loc.name);
    window.location.href = link;
  }
  document.getElementById('nextStopBtn').addEventListener('click', goToNextStop);
  document.getElementById('resetDoneBtn').addEventListener('click', function(){
    if (state.order) state.order.completed = {};
    renderRoute();
    toast('완료 표시를 초기화했어요.');
  });

  document.getElementById('copyRouteBtn').addEventListener('click', function(){
    if (!state.order) return;
    var departMin = parseHHMM(document.getElementById('departTime').value) || 180;
    var schedule = estimateSchedule(departMin, state.order.seq, state.order.legs);
    var lines = [fmtHHMM(departMin) + ' ' + state.order.start.name + ' (출발)'];
    schedule.forEach(function(entry, i){
      lines.push((i+1) + '. [' + (entry.arrivalMin!=null?fmtHHMM(entry.arrivalMin):'--:--') + '] ' + entry.loc.name + (entry.loc.address ? ' - ' + entry.loc.address : '') + (entry.early ? ' (⏰개점 전)' : ''));
    });
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('복사했어요.'); }, function(){ toast('복사에 실패했어요.'); });
    } else { toast('이 브라우저에서는 복사가 지원되지 않아요.'); }
  });

  state.locations = loadLocations();
  renderAll();
})();
</script>
</body>
</html>
